<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Watch Movies & Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121c;
            --bg-card: #181828;
            --bg-card-hover: #202036;
            --bg-nav: rgba(10, 10, 15, 0.85);
            --surface: #1a1a2a;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --text-muted: #6a6a7e;
            --accent: #e50914;
            --accent-hover: #ff1a1a;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --gradient-accent: linear-gradient(135deg, #e50914, #ff6b35);
            --gradient-warm: linear-gradient(135deg, #e50914, #f97316);
            --gradient-teal: linear-gradient(135deg, #06b6d4, #3b82f6);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #ec4899);
            --gradient-gold: linear-gradient(135deg, #f59e0b, #ef4444);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 9, 20, 0.3);
            --shadow-modal: 0 32px 80px rgba(0, 0, 0, 0.8);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            --font-body: 'Inter', sans-serif;
            --font-display: 'Poppins', sans-serif;
            --nav-height: 68px;
            --hero-height: 88vh;
            --card-width: 220px;
            --card-height: 330px;
            --card-width-large: 260px;
            --card-height-large: 390px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            line-height: 1.6;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a50;
        }

        /* ============ NAVIGATION ============ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            transition: var(--transition-medium);
            background: transparent;
        }
        .navbar.scrolled {
            background: var(--bg-nav);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        .navbar.scrolled .nav-logo {
            font-size: 1.45rem;
        }
        .nav-logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-medium);
            user-select: none;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-logo-icon {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
            color: var(--accent);
            display: inline-block;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 6px rgba(229, 9, 20, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(229, 9, 20, 0.9));
            }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            transition: var(--transition-medium);
        }
        .nav-links li a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            transition: var(--transition-fast);
            position: relative;
            letter-spacing: 0.2px;
            cursor: pointer;
        }
        .nav-links li a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .nav-links li a.active {
            color: var(--text-primary);
            background: rgba(229, 9, 20, 0.12);
        }
        .nav-links li a.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-search {
            position: relative;
            display: flex;
            align-items: center;
        }
        .nav-search input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 9px 16px 9px 40px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            width: 220px;
            transition: var(--transition-medium);
            font-family: var(--font-body);
            outline: none;
            letter-spacing: 0.3px;
        }
        .nav-search input::placeholder {
            color: var(--text-muted);
        }
        .nav-search input:focus {
            width: 300px;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.15);
        }
        .nav-search .search-icon {
            position: absolute;
            left: 14px;
            font-size: 0.9rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition-fast);
        }
        .nav-search input:focus~.search-icon {
            color: var(--accent);
        }
        .nav-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: var(--gradient-teal);
            font-weight: 600;
            color: #fff;
            transition: var(--transition-fast);
            border: 2px solid transparent;
            user-select: none;
            position: relative;
        }
        .nav-profile:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 16px rgba(229, 9, 20, 0.3);
        }
        .nav-profile .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }

        /* ============ HERO SECTION ============ */
        .hero {
            position: relative;
            height: var(--hero-height);
            min-height: 600px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            background: var(--bg-primary);
        }
        .hero-background {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }
        .hero-background .hero-bg-img {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            animation: kenBurns 12s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        .hero-background .hero-bg-img.active {
            opacity: 1;
        }
        @keyframes kenBurns {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.08);
            }
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(to top, var(--bg-primary) 8%, rgba(10, 10, 15, 0.7) 40%, rgba(10, 10, 15, 0.3) 70%, rgba(10, 10, 15, 0.6) 100%);
            background: linear-gradient(to right, rgba(10, 10, 15, 0.95) 0%, rgba(10, 10, 15, 0.5) 50%, rgba(10, 10, 15, 0.2) 100%), linear-gradient(to top, var(--bg-primary) 5%, rgba(10, 10, 15, 0.5) 50%, rgba(10, 10, 15, 0.4) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 3;
            padding: 0 64px 80px;
            max-width: 700px;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .hero-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }
        .hero-badge.quality {
            background: var(--gradient-accent);
            color: #fff;
            border: none;
        }
        .hero-badge.rating {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.4);
            color: #fbbf24;
        }
        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.05;
            margin-bottom: 12px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .hero-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .hero-meta .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .hero-description {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 28px;
            max-width: 560px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 28px;
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            transition: var(--transition-medium);
            letter-spacing: 0.3px;
            text-decoration: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn-play {
            background: var(--gradient-accent);
            color: #fff;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(229, 9, 20, 0.55);
        }
        .btn-play:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(229, 9, 20, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .btn-secondary:active {
            transform: translateY(0);
        }
        .btn .btn-icon {
            font-size: 1.1rem;
        }
        .hero-dots {
            position: absolute;
            z-index: 3;
            bottom: 28px;
            right: 64px;
            display: flex;
            gap: 8px;
        }
        .hero-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            cursor: pointer;
            transition: var(--transition-medium);
            padding: 0;
        }
        .hero-dot.active {
            background: var(--accent);
            width: 28px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.5);
        }
        .hero-dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* ============ MAIN CONTENT ============ */
        .main-content {
            position: relative;
            z-index: 5;
            margin-top: -40px;
            padding-bottom: 60px;
        }
        .genre-bar {
            display: flex;
            gap: 8px;
            padding: 0 64px;
            margin-bottom: 36px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-wrap: nowrap;
            position: relative;
            z-index: 6;
        }
        .genre-bar::-webkit-scrollbar {
            display: none;
        }
        .genre-chip {
            white-space: nowrap;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transition: var(--transition-fast);
            font-family: var(--font-body);
            letter-spacing: 0.2px;
            user-select: none;
        }
        .genre-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }
        .genre-chip.active {
            background: var(--gradient-accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(229, 9, 20, 0.3);
        }

        /* Movie Rows */
        .movie-row {
            margin-bottom: 44px;
            padding: 0 64px;
            position: relative;
        }
        .movie-row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .movie-row-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .movie-row-title .row-accent {
            width: 4px;
            height: 22px;
            border-radius: 4px;
            background: var(--gradient-accent);
        }
        .movie-row-link {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
            font-weight: 500;
        }
        .movie-row-link:hover {
            color: var(--accent);
        }
        .movie-row-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 8px 0;
            scroll-behavior: smooth;
            position: relative;
        }
        .movie-row-scroll::-webkit-scrollbar {
            display: none;
        }
        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-medium);
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .movie-row:hover .scroll-btn {
            opacity: 1;
            pointer-events: all;
        }
        .scroll-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }
        .scroll-btn.left {
            left: 52px;
        }
        .scroll-btn.right {
            right: 52px;
        }

        /* Movie Cards */
        .movie-card {
            flex-shrink: 0;
            width: var(--card-width);
            cursor: pointer;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            background: var(--bg-card);
            transition: var(--transition-medium);
            border: 1px solid var(--border);
            aspect-ratio: 2/3;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .movie-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-hover);
            z-index: 5;
        }
        .movie-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: var(--transition-medium);
            pointer-events: none;
        }
        .movie-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0) 70%);
            opacity: 0;
            transition: var(--transition-medium);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            pointer-events: none;
        }
        .movie-card:hover .movie-card-overlay {
            opacity: 1;
        }
        .movie-card-overlay .card-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-accent);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-medium);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
            opacity: 0;
            pointer-events: none;
        }
        .movie-card:hover .card-play-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }
        .card-play-btn:hover {
            box-shadow: 0 8px 32px rgba(229, 9, 20, 0.7);
        }
        .movie-card-info {
            position: relative;
            z-index: 2;
        }
        .movie-card-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .movie-card-meta .star {
            color: #fbbf24;
        }
        .movie-card-rating-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 3px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            pointer-events: none;
        }
        .movie-card-quality {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(229, 9, 20, 0.85);
            color: #fff;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
            transition: var(--transition-fast);
            pointer-events: none;
        }

        /* ============ MODAL ============ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-medium);
            padding: 20px;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 720px;
            max-height: 88vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            transform: scale(0.9) translateY(20px);
            transition: var(--transition-medium);
            box-shadow: var(--shadow-modal);
            position: relative;
        }
        .modal-backdrop.open .modal {
            transform: scale(1) translateY(0);
        }
        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal-hero {
            position: relative;
            height: 300px;
            overflow: hidden;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }
        .modal-hero-img {
            width: 100%;

            // ==================== UTILITY FUNCTIONS ====================
            function getPosterUrl(seed, w = 400, h = 600) {
                return `https://picsum.photos/seed/${seed}/${w}/${h}`;
            }

            function getBackdropUrl(seed, w = 1920, h = 1080) {
                return `https://picsum.photos/seed/${seed}/${w}/${h}`;
            }

            function formatDuration(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            function formatMovieDuration(totalSeconds) {
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                if (hrs > 0) return `${hrs}h ${mins}m`;
                return `${mins}m`;
            }

            function showToast(message, icon = '✓') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<span class="toast-icon">${icon}</span>${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('removing');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            function isInWatchlist(movieId) {
                return watchlist.includes(movieId);
            }

            function toggleWatchlist(movieId) {
                if (isInWatchlist(movieId)) {
                    watchlist = watchlist.filter(id => id !== movieId);
                    localStorage.setItem('cinewatch_watchlist', JSON.stringify(watchlist));
                    showToast('Removed from My List', '🗑️');
                    return false;
                } else {
                    watchlist.push(movieId);
                    localStorage.setItem('cinewatch_watchlist', JSON.stringify(watchlist));
                    showToast('Added to My List', '✓');
                    return true;
                }
            }

            function renderHero() {
                const featured = getFeaturedMovies();
                if (featured.length === 0) return;
                const movie = featured[currentHeroIndex % featured.length];

                // Render backgrounds
                heroBackground.innerHTML = featured.map((m, i) =>
                    `<div class="hero-bg-img ${i === currentHeroIndex % featured.length ? 'active' : ''}" 
                          style="background-image: url('${getBackdropUrl(m.backdropSeed)}')"></div>`
                ).join('');

                // Render content
                heroContent.innerHTML = `
                    <div class="hero-badge-row">
                        <span class="hero-badge quality">${movie.quality}</span>
                        <span class="hero-badge rating">⭐ ${movie.rating}</span>
                        <span class="hero-badge">${movie.year}</span>
                        <span class="hero-badge">${movie.duration}</span>
                    </div>
                    <h1 class="hero-title">${movie.title}</h1>
                    <div class="hero-meta">
                        <span>🎬 ${movie.type === 'movie' ? 'Movie' : 'Series'}</span>
                        <span class="dot"></span>
                        <span>${movie.genre}</span>
                        <span class="dot"></span>
                        <span>${movie.year}</span>
                    </div>
                    <p class="hero-description">${movie.description}</p>
                    <div class="hero-buttons">
                        <button class="btn btn-play" onclick="window._playMovie(${movie.id})">
                            <span class="btn-icon">▶</span> Play Now
                        </button>
                        <button class="btn btn-secondary" onclick="window._openDetail(${movie.id})">
                            <span class="btn-icon">ℹ</span> More Info
                        </button>
                    </div>
                `;

                // Render dots
                heroDots.innerHTML = featured.map((_, i) =>
                    `<button class="hero-dot ${i === currentHeroIndex % featured.length ? 'active' : ''}" 
                          onclick="window._goToHero(${i})" aria-label="Slide ${i + 1}"></button>`
                ).join('');
            }

            function startHeroRotation() {
                stopHeroRotation();
                heroInterval = setInterval(() => {
                    currentHeroIndex++;
                    renderHero();
                }, 6000);
            }

            function stopHeroRotation() {
                if (heroInterval) {
                    clearInterval(heroInterval);
                    heroInterval = null;
                }
            }

            window._goToHero = function(index) {
                currentHeroIndex = index;
                renderHero();
                startHeroRotation();
            };

            window._playMovie = function(movieId) {
                const movie = movies.find(m => m.id === movieId);
                if (movie) openPlayer(movie);
            };

            window._openDetail = function(movieId) {
                const movie = movies.find(m => m.id === movieId);
                if (movie) openDetailModal(movie);
            };

            // ==================== GENRE BAR ====================
            function renderGenreBar() {
                const genres = ['All', ...new Set(movies.map(m => m.genre))];
                genreBar.innerHTML = genres.map(genre =>
                    `<button class="genre-chip ${genre === currentGenre ? 'active' : ''}" 
                          data-genre="${genre}">${genre}</button>`
                ).join('');
                genreBar.querySelectorAll('.genre-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        currentGenre = chip.dataset.genre;
                        renderGenreBar();
                        renderMovieRows();
                    });
                });
            }

            // ==================== MOVIE ROWS ====================
            function getFilteredMovies() {
                let filtered = [...movies];
                if (currentGenre !== 'All') {
                    filtered = filtered.filter(m => m.genre === currentGenre);
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase().trim();
                    filtered = filtered.filter(m =>
                        m.title.toLowerCase().includes(q) ||
                        m.genre.toLowerCase().includes(q) ||
                        m.description.toLowerCase().includes(q) ||
                        m.cast.some(c => c.toLowerCase().includes(q))
                    );
                }
                return filtered;
            }

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.animationDelay = `${Math.random() * 0.3}s`;
                card.innerHTML = `
                    <img class="movie-card-img" src="${getPosterUrl(movie.posterSeed)}" alt="${movie.title}" loading="lazy">

                                <span>${movie.rating}</span>
                                ${inList ? '<span style="color:#22c55e">✓</span>' : ''}
                            </div>
                        </div>
                    </div>
                `;

                card.querySelector('.card-play-btn').addEventListener('click', (e) => {

                return card;

                movieRows.innerHTML = rowsHtml.join('');

                // Attach scroll button events
                movieRows.querySelectorAll('.movie-row').forEach(row => {
                    const container = row.querySelector('.movie-row-scroll');
                    const leftBtn = row.querySelector('.scroll-btn.left');
                    const rightBtn = row.querySelector('.scroll-btn.right');
                    if (leftBtn) leftBtn.addEventListener('click', () => {
                        container.scrollBy({ left: -600, behavior: 'smooth' });
                    });
                    if (rightBtn) rightBtn.addEventListener('click', () => {
                        container.scrollBy({ left: 600, behavior: 'smooth' });
                    });
                });

                // Attach card events
                movieRows.querySelectorAll('.movie-card').forEach(card => {
                    const movieId = parseInt(card.dataset.movieId);
                    const movie = movies.find(m => m.id === movieId);
                    if (!movie) return;
                    const playBtn = card.querySelector('.card-play-btn');
                    if (playBtn) {
                        playBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openPlayer(movie);
                        });
                    }
                    card.addEventListener('click', () => openDetailModal(movie));
                });
            }

            function createRowHTML(className, title, movieList) {
                const cards = movieList.map(m => {
                    const inList = isInWatchlist(m.id);
                    return `
                    <div class="movie-card" data-movie-id="${m.id}">
                        <img class="movie-card-img" src="${getPosterUrl(m.posterSeed)}" alt="${m.title}" loading="lazy">
                        <span class="movie-card-quality">${m.quality}</span>
                        <span class="movie-card-rating-badge">⭐ ${m.rating}</span>
                        <div class="movie-card-overlay">
                            <button class="card-play-btn" title="Play">▶</button>
                            <div class="movie-card-info">
                                <p class="movie-card-title">${m.title}</p>
                                <div class="movie-card-meta">
                                    <span>${m.year}</span>
                                    <span>•</span>
                                    <span class="star">⭐</span>
                                    <span>${m.rating}</span>
                                    ${inList ? '<span style="color:#22c55e">✓</span>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                }).join('');
                return `
                <div class="movie-row" data-row="${className}">
                    <div class="movie-row-header">
                        <h3 class="movie-row-title"><span class="row-accent"></span>${title}</h3>
                        <span class="movie-row-link">View All →</span>
                    </div>
                    <div class="movie-row-scroll">
                        ${cards}
                    </div>
                    <button class="scroll-btn left">‹</button>
                    <button class="scroll-btn right">›</button>
                </div>
            `;
            }

            // ==================== SEARCH ====================
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMovieRows();
            });

            // ==================== NAVIGATION ====================
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navLinks.querySelectorAll('a').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    navLinks.classList.remove('open');
                    const section = link.dataset.section;
                    if (section === 'mylist') {
                        currentGenre = 'All';
                        searchQuery = '';
                        searchInput.value = '';
                        const wlMovies = movies.filter(m => isInWatchlist(m.id));
                        if (wlMovies.length === 0) {
                            movieRows.innerHTML = '';
                            emptyState.classList.add('visible');
                            emptyState.innerHTML =
                                `<div class="empty-icon">📋</div><p>Your list is empty. Add movies to watch later!</p>`;
                        } else {
                            currentGenre = 'All';
                            renderGenreBar();
                            renderMovieRows();
                        }
                    } else if (section === 'home') {
                        currentGenre = 'All';
                        searchQuery = '';
                        searchInput.value = '';
                        renderGenreBar();
                        renderMovieRows();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else if (section === 'movies' || section === 'series') {
                        currentGenre = 'All';
                        searchQuery = '';
                        searchInput.value = '';
                        const type = section === 'movies' ? 'movie' : 'series';
                        const filtered = movies.filter(m => m.type === type);
                        renderGenreBar();
                        renderMovieRows();
                    } else {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });

            navLogo.addEventListener('click', () => {
                currentGenre = 'All';
                searchQuery = '';
                searchInput.value = '';
                renderGenreBar();
                renderMovieRows();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== DETAIL MODAL ====================
            function openDetailModal(movie) {
                currentDetailMovie = movie;
                modalHeroImg.src = getBackdropUrl(movie.backdropSeed);
                modalTitle.textContent = movie.title;
                modalMeta.innerHTML = `
                    <span class="badge badge-rating">⭐ ${movie.rating}</span>
                    <span class="badge badge-genre">${movie.genre}</span>
                    <span>${movie.year}</span>
                    <span>${movie.duration}</span>
                    <span>${movie.quality}</span>
                `;
                modalDescription.textContent = movie.description;
                modalCast.innerHTML = movie.cast.map(c => `<span>${c}</span>`).join('');
                updateWatchlistButton();
                detailModalBackdrop.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeDetailModal() {
                detailModalBackdrop.classList.remove('open');
                document.body.style.overflow = '';
                currentDetailMovie = null;
                renderMovieRows();
            }

            function updateWatchlistButton() {
                if (!currentDetailMovie) return;
                const inList = isInWatchlist(currentDetailMovie.id);
                if (inList) {
                    modalWatchlistBtn.classList.add('in-list');
                    watchlistBtnText.textContent = '✓ In My List';
                } else {
                    modalWatchlistBtn.classList.remove('in-list');
                    watchlistBtnText.textContent = '+ Add to List';
                }
            }

            modalClose.addEventListener('click', closeDetailModal);
            detailModalBackdrop.addEventListener('click', (e) => {
                if (e.target === detailModalBackdrop) closeDetailModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDetailModal();
                    closePlayer();
                }
            });

            modalWatchlistBtn.addEventListener('click', () => {
                if (!currentDetailMovie) return;
                toggleWatchlist(currentDetailMovie.id);
                updateWatchlistButton();
            });

            modalPlayBtn.addEventListener('click', () => {
                if (currentDetailMovie) {
                    closeDetailModal();
                    openPlayer(currentDetailMovie);
                }
            });

            // ==================== VIDEO PLAYER ====================
            function openPlayer(movie) {
                playerTitle.textContent = movie.title;
                playerVideoBg.style.backgroundImage = `url('${getBackdropUrl(movie.backdropSeed)}')`;
                playerBackdrop.classList.add('open');
                document.body.style.overflow = 'hidden';
                playerLoading.classList.remove('hidden');
                playerControls.classList.remove('visible');
                playerTitleBar.classList.remove('visible');
                playerProgress = 0;
                isPlayerPlaying = false;
                playerPlayBtn.textContent = '▶';
                updatePlayerProgress();

                // Simulate loading
                setTimeout(() => {
                    playerLoading.classList.add('hidden');
                    playerControls.classList.add('visible');
                    playerTitleBar.classList.add('visible');
                    isPlayerPlaying = true;
                    playerPlayBtn.textContent = '⏸';
                    startPlayerInterval();
                }, 1800);
            }

            function closePlayer() {
                playerBackdrop.classList.remove('open');
                document.body.style.overflow = '';
                stopPlayerInterval();
                isPlayerPlaying = false;
            }

            function startPlayerInterval() {
                stopPlayerInterval();
                playerInterval = setInterval(() => {
                    if (isPlayerPlaying && playerProgress < playerDuration) {
                        playerProgress += 1;
                        updatePlayerProgress();
                    }
                }, 1000);
            }

            function stopPlayerInterval() {
                if (playerInterval) {
                    clearInterval(playerInterval);
                    playerInterval = null;
                }
            }

            function updatePlayerProgress() {
                const pct = (playerProgress / playerDuration) * 100;
                playerProgressFill.style.width = `${pct}%`;
                playerCurrentTime.textContent = formatDuration(playerProgress);
                playerTotalTime.textContent = formatDuration(playerDuration);
            }

            playerCloseBtn.addEventListener('click', closePlayer);
            playerBackdrop.addEventListener('click', (e) => {
                if (e.target === playerBackdrop) closePlayer();
            });

            playerPlayBtn.addEventListener('click', () => {
                if (isPlayerPlaying) {
                    isPlayerPlaying = false;
                    playerPlayBtn.textContent = '▶';
                } else {
                    isPlayerPlaying = true;
                    playerPlayBtn.textContent = '⏸';
                }
                startPlayerInterval();
            });

            playerVolumeBtn.addEventListener('click', () => {
                playerVolumeBtn.textContent = playerVolumeBtn.textContent === '🔊' ? '🔇' : '🔊';
            });

            playerProgressBar.addEventListener('click', (e) => {
                const rect = playerProgressBar.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                playerProgress = Math.floor(pct * playerDuration);
                updatePlayerProgress();
            });

            // ==================== INIT ====================
            function init() {
                renderHero();
                startHeroRotation();
                renderGenreBar();
                renderMovieRows();
            }

            init();

            // Handle keyboard for search
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    renderMovieRows();
                }
            });

            // Responsive nav links
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    navLinks.classList.remove('open');
                }
            });

            console.log('🎬 CineStream initialized successfully!');
            console.log(`📀 ${movies.length} movies loaded`);
            console.log(`📋 ${watchlist.length} in watchlist`);
        })();
    </script>
</body>
</html>
